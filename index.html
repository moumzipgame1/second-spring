<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두 번째 봄</title>
<style>
:root{--bg:#fbeef1;--fg:#41323a;--mut:#8f7a83;--pan:#fff8f9;--line:#f0d6dd;--acc:#d06a82;--key:#a2577a;--ok:#5f8f78;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.t2{--bg:#efe6e9;--fg:#33292e;--mut:#857980;--pan:#f8f2f4;--line:#ddd0d5;--acc:#a9677a;--key:#7e5a70;--ok:#5a8476}
body.t3{--bg:#e3e6ea;--fg:#272b30;--mut:#7a828a;--pan:#f1f3f5;--line:#cfd5db;--acc:#8a6070;--key:#5d6f86;--ok:#4f7d7a}
body.t4{--bg:#101215;--fg:#d9dde1;--mut:#858d95;--pan:#171a1e;--line:#2a2f35;--acc:#d46d7d;--key:#86a4bd;--ok:#7fb39c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px 16px 48px}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(9px);transform:scale(1.08);opacity:0;transition:opacity .8s}
#bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.8}
#scene{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:8px;margin:12px 0 0;background:#0d1114}
#scene[hidden]{display:none}

.eimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:0 0 16px}
#timg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:0 0 20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--key);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
header .t{font-size:13px;color:var(--mut);letter-spacing:.04em;line-height:1.4}
header .t b{display:block;color:var(--fg);font-size:15px;letter-spacing:.02em}
#place{font-size:22px;font-weight:700;margin:14px 0 0}
#desc{margin:2px 0 12px;color:var(--mut);font-size:15px}
#log{background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:12px 14px;height:36vh;min-height:190px;overflow-y:auto}
#log p{margin:0 0 10px;white-space:pre-line;opacity:.55}
#log p.new{opacity:1}
#log p.sys{color:var(--key);font-size:14px}
#log p.new:not(.sys){border-left:3px solid var(--acc);padding-left:10px}
.lbl{font-size:12px;color:var(--mut);letter-spacing:.1em;margin:14px 0 6px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.btn,#spots button,.chip{background:var(--pan);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-align:left}
#spots button:hover,.btn:hover,.chip:hover{border-color:var(--key)}
#moves button{background:transparent;border:1px dashed var(--key);color:var(--key);border-radius:999px;padding:7px 14px}
#chp{display:none;flex-direction:column;gap:8px;margin:14px 0}
#chp.on{display:flex}
#chp .btn{border-color:var(--acc)}
.chip.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
#selbar{display:none;margin-top:10px;font-size:14px;color:var(--acc)}
#selbar.on{display:block}
.panel{display:none;margin:12px 0;padding:12px;border:1px solid var(--acc);border-radius:8px;background:var(--pan)}
.panel.on{display:block}
#codein{font:inherit;width:9em;padding:6px 8px;margin:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);letter-spacing:.25em;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin:10px 0}
.pad button{height:46px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:600}
.pad button:active{background:var(--key);color:#fff}
.disp{font:600 20px/1 ui-monospace,Menlo,monospace;letter-spacing:.4em;min-height:24px}
.bottles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.bottles button{width:92px;padding:8px 4px;border:1px solid var(--line);border-radius:6px 6px 14px 14px;background:var(--bg);text-align:center;font-size:13px;line-height:1.4}
.bottles button b{display:block;font-size:20px}
.bottles button.used{opacity:.3}
details{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--pan)}
summary{cursor:pointer;padding:10px 14px;font-weight:600}
#notes{list-style:none;margin:0;padding:0 10px 10px}
#notes li{margin:0 0 6px}
#notes button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;font-size:15px;color:var(--fg)}
#notes button:hover{border-color:var(--line)}
#notes button.sel{border-color:var(--acc)}
.faint{color:var(--mut);opacity:.6;filter:blur(.35px)}
.msg{align-self:flex-end;max-width:80%;background:var(--acc);color:#fff;border-radius:14px 14px 4px 14px;padding:6px 12px;margin:0 0 10px auto;width:fit-content;font-size:15px}
.msg.cold{background:var(--line);color:var(--fg)}
.ghost{display:inline-block;width:1em;margin-left:-1em;opacity:.5;filter:blur(.6px);transform:translate(.2em,.06em);pointer-events:none;user-select:none}
@media(prefers-reduced-motion:reduce){.ghost{filter:none}}
#rc{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;z-index:20}
#rc .card{background:var(--pan);border:1px solid var(--ok);border-radius:12px;padding:16px 22px;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#rc .t{font-size:13px;letter-spacing:.2em;color:var(--ok);font-weight:700}
#rc .q{margin:8px 0 4px;font-size:17px}
#rc .w{font-size:14px;color:var(--mut)}
#rc.show{animation:rc 2.8s ease forwards}
#rc.show .card{animation:rcc 2.8s ease forwards}
#chill{position:fixed;inset:0;pointer-events:none;z-index:19;background:radial-gradient(ellipse at center,transparent 40%,rgba(40,60,80,.38));opacity:0}
#chill.show{animation:ch 2.8s ease forwards}
@keyframes rc{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes rcc{0%{transform:translateY(8px) scale(.98)}12%{transform:none}100%{transform:translateY(-6px)}}
@keyframes ch{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#rc.show,#rc.show .card,#chill.show{animation-duration:.01s}}
#notes .then{display:block;font-size:13px;color:var(--mut)}
.dots{display:grid;grid-template-columns:repeat(3,64px);gap:14px;margin:12px 0;padding:14px;border-radius:14px;background:#1b1d21;width:fit-content}
.dots button{width:64px;height:64px;border-radius:50%;border:2px solid #3a3d44;background:#26292f;color:transparent}
.dots button.on{background:#6b7a8f;border-color:#9fb1c8}
.dots.lit button.s1{box-shadow:0 0 0 6px rgba(220,220,200,.55) inset}
.dots.lit button.s2{box-shadow:0 0 0 6px rgba(220,220,200,.3) inset}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.photos button{width:120px;min-height:86px;border:6px solid #f4f1ea;border-bottom-width:18px;background:#d9d2c6;color:#3a332c;font-size:12px;line-height:1.4;padding:6px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.photos button.used{opacity:.3}
.used{display:inline-block;margin-left:6px;font-size:12px;color:var(--ok);border:1px solid var(--ok);border-radius:3px;padding:0 5px;white-space:nowrap}
table.grid{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.grid td,table.grid th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:middle}
table.grid tr.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px}
.seg button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.strip{display:flex;gap:6px;align-items:center;margin:4px 0}
.strip button.s{flex:1;text-align:center;padding:6px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.strip button.s.used{opacity:.3}
.phone{border:2px solid var(--fg);border-radius:22px;padding:14px;max-width:380px;background:var(--bg)}
.phone .tabs{display:flex;gap:6px;margin-bottom:10px}
.phone .tabs button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--pan)}
.phone .tabs button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px}
.chk button{margin-left:auto;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--pan);font-size:13px}
.chk button.on{border-color:var(--ok);color:var(--ok)}
.act{font-weight:700;color:var(--acc)}
.doc{border:1px solid var(--line);background:var(--pan);padding:14px 16px;border-radius:6px;margin:12px 0;font-size:15px}
.doc h3{margin:0 0 4px;font-size:18px}
.doc .by{font-size:12px;color:var(--mut);margin-bottom:10px}
.ntip{font-size:13px;color:var(--mut);padding:0 18px 4px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ov{position:fixed;inset:0;z-index:5;background:var(--bg);display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8vh) 22px 40px}
.ov.on{display:block}
.ov>div{max-width:540px;margin:0 auto}
.ov h2{font-size:34px;margin:0 0 4px;letter-spacing:.12em}
.sub{color:var(--mut);margin:0 0 22px}
.q{color:var(--mut);font-size:15px}
.tag{display:inline-block;border:1px solid var(--acc);color:var(--acc);padding:0 8px;border-radius:3px;font-size:13px}
#card{cursor:pointer;text-align:center;padding-top:calc(env(safe-area-inset-top,0px) + 28vh)}
#card .big{font-size:28px;font-weight:700;letter-spacing:.08em;margin:6px 0}
#card .slp{font-size:18px;color:var(--acc);margin-top:18px}
table.res{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
table.res td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
.okc{color:var(--ok);font-weight:600}.noc{color:var(--acc);font-weight:600}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.slots div{border:1px dashed var(--line);border-radius:6px;padding:12px;color:var(--mut)}
.slots div.got{border-style:solid;color:var(--fg)}
.mut{color:var(--mut);font-size:14px}
</style></head><body>
<div id="bg"></div><div id="app">
<header><div class="t"><b id="htitle">온보딩</b><span id="hsub"></span></div><button class="btn" id="hintb">힌트</button></header>
<img id="scene" alt="" hidden><div id="place"></div><p id="desc"></p>
<div id="log" aria-live="polite"></div>
<div class="panel" id="codep"><div id="codeh"></div><div id="codebox"></div></div>
<div class="panel" id="ordp"></div>
<div id="acts"><div class="lbl">조사하기</div><div class="wrap" id="spots"></div><div id="mw"><div class="lbl">이동</div><div class="wrap" id="moves"></div></div></div>
<div id="chp"></div>
<div class="lbl">가방</div><div class="wrap" id="inv"></div>
<div id="selbar"></div>
<details id="nd"><summary>단서 노트 <span id="nc"></span></summary><p class="ntip">단서를 누른 뒤 인물을 누르면 그 단서를 제시합니다. 실제로 쓰인 단서에는 '회수됨'이 붙습니다.</p><ul id="notes"></ul></details>
<div class="row"><button class="btn" id="reset">처음부터</button></div>
</div>

<div class="ov on" id="title"><div>
<img id="timg" src="img/title.webp" alt="" onerror="this.remove()">
<h2>두 번째 봄</h2><p class="sub">SECOND SPRING</p>
<p>사귄 지 1년, 기념일까지 엿새. 요즘 그녀는 전보다 더 다정하다.<br>“두 번째 봄은 같이 시작하고 싶어.”</p>
<p class="q">연애 공포 미스터리 · 약 60분 · 감금, 집착, 사망 장면이 나옵니다.</p>
<div id="dstat" style="display:none;text-align:center;margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;line-height:1.8"></div>
<div class="row"><button class="btn" id="start">새로 시작</button><button class="btn" id="cont" style="display:none">이어하기</button><button class="btn" id="gal">엔딩 도감</button></div>
</div></div>
<div class="ov" id="card"><div><p class="tag" id="cardtag"></p><div class="big" id="cardname"></div><div class="slp" id="cardslp"></div><p class="q" style="margin-top:40px">화면을 눌러 계속</p></div></div>
<div class="ov" id="endv"><div id="endc"></div></div>
<div id="chill"></div><div id="rc"><div class="card"><div class="t">회수됨</div><div class="q" id="rq"></div><div class="w" id="rw"></div></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const KEY="spring_v1",GKEY="spring_endings";
const ENDINGS=["봄","같은 얼굴","잘못 고른 손","사라진 봄","1주년","두 번째 봄"];

/* ---------- 아이템 ---------- */
const ITEMS={
ticket:["영화 티켓","1년 전 첫 영화. ‘7관 F12’. 정우가 지갑에 넣고 다닌다."],
vax:["두부의 예방접종 수첩","‘입양일 3월 14일’. 두 사람의 이름이 나란히 적혀 있다."],
camera:["필름 카메라","채원의 카메라. 24장을 다 찍은 필름이 들어 있다. 플래시가 된다."],
churu:["두부 간식 (츄르)","두부가 제일 좋아하는 참치 맛."],
cleanser:["클렌징 워터","화장솜에 적시면 화장이 지워진다."],
card:["오래된 연하장","스캔해 둔 연하장. ‘채원이, 채은이 모두 건강하길. — 정숙 이모’"],
key:["여분 열쇠","채원이 1년 전 국밥집 사장님께 ‘혹시 몰라서’ 맡긴 원룸 열쇠 꾸러미. 건물 출입문 열쇠도 달려 있다."]};
const iname=id=>ITEMS[id][0],idesc=id=>{const d=ITEMS[id][1];return typeof d==="function"?d():d};

/* ---------- 상태 ---------- */
let S=null,CODE=null,PANEL=null,CH=null,SAID=0;
const fresh=()=>({ch:1,room:"r1",f:{},g:{},inv:[],notes:[],sel:null,log:[],from:0,over:0,alert:0,hk:"",hl:0,time:"",snap:null});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const load=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}};
const gotEnd=()=>{try{return JSON.parse(localStorage.getItem(GKEY)||"[]")}catch(e){return []}};
function markEnd(n){try{const g=gotEnd();if(!g.includes(n)){g.push(n);localStorage.setItem(GKEY,JSON.stringify(g))}}catch(e){}}
const F=()=>S.f,G=()=>S.g;
let PEND=[];
function flushP(){if(PEND.length){PEND.forEach(x=>S.log.push("§"+x));PEND=[]}}
function say(t){S.log.push(t);flushP();while(S.log.length>60){S.log.shift();S.from=Math.max(0,S.from-1)}SAID=1;queueMicrotask(()=>{SAID=0});render()}
function sys(t){if(SAID){S.log.push("§"+t);render()}else{PEND.push(t);queueMicrotask(()=>{if(PEND.length){flushP();render()}})}}
function note(id,t){if(S.notes.some(n=>n.id===id))return;S.notes.push({id,t});sys("단서 노트 — "+t)}
const hasN=id=>S.notes.some(n=>n.id===id);
/* 회수됨: 단서가 실제로 쓰이는 순간. 가운데 카드 + 화면이 잠깐 식음(B안) */
let RCQ=[];
function used(id,why){const n=S.notes.find(x=>x.id===id);if(!n||n.used)return;n.used=1;n.then=why||"";RCQ.push([n.t.split(" — ")[1]||n.t.split(" — ")[0],why||""]);if(RCQ.length===1)setTimeout(rcNext,250)}
function rcNext(){if(!RCQ.length)return;const [q,w]=RCQ[0];$("rq").textContent=q;$("rw").textContent="단서가 이어졌다"+(w?" — "+w:"");const rc=$("rc"),ch=$("chill");rc.classList.remove("show");ch.classList.remove("show");void rc.offsetWidth;rc.classList.add("show");ch.classList.add("show");setTimeout(()=>{RCQ.shift();rcNext()},2900)}
/* 증거 점수 = 어긋남 x1~x8 중 회수까지 된 수 */
const evid=()=>S.notes.filter(n=>/^x\d$/.test(n.id)&&n.used).length;
function give(id){if(!S.inv.includes(id)){S.inv.push(id);sys("가방에 넣었다 — "+iname(id))}}
function take(id){S.inv=S.inv.filter(i=>i!==id)}
const has=id=>S.inv.includes(id);
/* 경계도: 채은이 눈치챈 정도 (0~5). 화면에 숫자를 보여 주지 않는다 */
function alertUp(n,why){S.alert=Math.max(0,Math.min(5,S.alert+n));(G().aw=G().aw||[]).push(why||"")}
function go(r,t){S.room=r;CODE=null;PANEL=null;S.sel=null;const R=ROOMS[r];if(R&&R.enter&&R.enter())return;say(t)}
const choose=o=>{CH=o;render()};
const nav=(n,r,t,show)=>({n,nav:1,show,look(){go(r,t)}});
/* 문자 메시지: ✉로 시작하는 줄은 말풍선으로 보인다 */
function msg(t){say("✉"+t)}

/* ---------- 입력 패널 ---------- */
function askCode(len,check,ok,h){PANEL=null;CODE={mode:"text",len,check,ok,h};render();setTimeout(()=>{const i=$("codein");if(i)i.focus()},0)}
function codeSubmit(){if(!CODE||CODE.mode!=="text")return;S.from=S.log.length;const v=$("codein").value.trim(),c=CODE,r=c.check(v);if(r===true){CODE=null;c.ok(v)}else{$("codein").value="";if(r)say(r)}}
function openPanel(p){CODE=null;PANEL=p;render()}
function closePanel(){PANEL=null;render()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ROOMS={};
const CHAP={};

/* ---------- 답장 카운터 (Firebase Firestore REST) ----------
   그녀에게 “나도 보고 싶어”라고 답장할 때마다 +1. 0이거나 연결이 안 되면 숨긴다. */
const FIREBASE={projectId:"seryn-onboarding",apiKey:"AIzaSyA8-MGweBNch69FOFpxgpK2CxsLuvaIfl4"};
const FB_DOC=()=>"projects/"+FIREBASE.projectId+"/databases/(default)/documents/stats/replies";
const fbOn=()=>!!(FIREBASE.projectId&&FIREBASE.apiKey);
async function fbGet(){if(!fbOn())return null;try{const r=await fetch("https://firestore.googleapis.com/v1/"+FB_DOC()+"?key="+FIREBASE.apiKey);if(!r.ok)return null;const j=await r.json();return +((j.fields&&j.fields.n&&j.fields.n.integerValue)||0)}catch(e){return null}}
function fbInc(k){if(!fbOn())return;try{fetch("https://firestore.googleapis.com/v1/projects/"+FIREBASE.projectId+"/databases/(default)/documents:commit?key="+FIREBASE.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,body:JSON.stringify({writes:[{transform:{document:FB_DOC(),fieldTransforms:[{fieldPath:"n",increment:{integerValue:String(k)}}]}}]})}).catch(()=>{})}catch(e){}}
function replied(){fbInc(1)}
async function showReplyStats(){const el=$("dstat");if(!el)return;el.style.display="none";
 const all=await fbGet();if(all&&all>0){el.innerHTML='<div>그녀에게 도착한 “나도 보고 싶어” <b>'+all.toLocaleString("ko-KR")+'통</b></div>';el.style.display=""}}

/* ================= 공통 ================= */
/* 떠보기: 그녀에게 어긋남 단서를 직접 들이밀면 처음 한 번 경계도 +1 */

  if(!f.callEnd)return["c",["이모에게 물어볼 수 있는 것은 모두 물어보세요.","네 가지 질문이 있습니다.","네 가지를 모두 묻고 전화를 끊으세요."]];
  return["d",["다음 장으로.","‘작업실을 나선다’","‘작업실을 나선다’"]]}
 if(c===5){if(!f.give)return["a",["채원의 카메라를 현상하세요.","가방의 필름 카메라를 사진관 주인에게 쓰세요.","필름 카메라 → 사진관 주인"]];
  if(!f.dev)return["b",["현상이 끝날 때까지 기다리세요.","‘한 시간을 기다린다’","‘한 시간을 기다린다’"]];
  if(!g.K1)return["c",["채원의 마지막 하루를 찍은 순서대로 놓으세요.","사진마다 시간 단서가 있습니다. 가득 찬 밥그릇, 벽시계, 그림자 길이, 영수증 시각.","D → B → F → E → A → C"]];
  return["d",["다음 장으로.","‘사진관을 나선다’","‘사진관을 나선다’"]]}
 if(c===6){if(!g.K2){if(S.room==="r6g"&&!F().gate)return["a",["지하 창고로 가야 합니다.","밤에는 입주자 열쇠가 필요합니다. 2장에서 받은 것이 있나요?","여분 열쇠 → 지하 계단 철문 (없으면 박 씨를 깨워야 합니다)"]];
   return["b",["어느 창고인지 특정해야 합니다. 엉뚱한 창고를 기웃거리면 박 씨가 그녀에게 말합니다.","관리실의 장부와 전력계, 두부의 반응, 문 너머 소리. 두 가지만 맞아도 충분합니다.","07"]]}
  return["c",["이제 어떻게 할지 정해야 합니다.","증거가 충분하고 그녀가 눈치채지 않았다면 신고가 가장 안전합니다. 확신이 없으면 직접 열 수도 있습니다.","신고 조건: 마지막 필름 컷 + 07번 + 회수된 단서 4개 이상"]]}
 if(c===7){if(!F().open)return["a",["‘이제 내 생일이에요.’ 이 휴대폰과 이 방의 주인은 누구일까요?","쌍둥이지만 동생은 자정을 넘겨 태어났습니다. 4장 이모의 이야기.","0928"]];
  if(!g.K3&&(F().w||0)<WALL.length)return["b",["이 방의 모든 것을 보세요. 벽의 사진은 여러 장입니다.","‘벽의 사진’을 끝까지 넘기면 새로운 것이 보입니다.","벽의 사진 6번 → 침대 밑 상자"]];
  return["c",["떠날 시간입니다.","‘방을 나선다’","‘방을 나선다’"]]}
 if(c===8){if(S.room==="r8p")return["a",["문이 열립니다.","‘문이 열린다’","‘문이 열린다’"]];
  return["b",["둘 중 진짜를 가려내야 합니다.","단서 노트의 손잡이·별명·복숭아 단서를 두 사람에게 제시하거나, 클렌징 워터를 써 보세요.","진짜는 오른쪽 사람입니다."]]}
 return["x",["","",""]]}
function hint(){const g=goal();if(S.hk!==g[0]){S.hk=g[0];S.hl=0}const lv=Math.min(S.hl,2);S.hl=lv+1;S.from=S.log.length;sys("힌트 "+(lv+1)+"/3 — "+g[1][lv]);render()}

/* ---------- 장면 이미지 (이미지가 준비되면 채운다) ---------- */
const SCENE={r1:"img/r1",r1d:"img/r1d",r2a:"img/r2a",r2b:"img/r2b",r3:"img/r3",r4a:"img/r4a",r5:"img/r5",r6g:"img/r6g",r6o:"img/r6o",r6r:"img/r6r",r6b:"img/r6b",r7:"img/r7",r7i:"img/r7i",r8p:"img/r8p",r8d:"img/r8d",r8:"img/r8d"};
function sceneImg(){const k=SCENE[S.room],im=$("scene"),bg=$("bg");if(!k){im.hidden=true;bg.style.opacity=0;return}const u=k+".webp";if(im.dataset.k!==k){im.dataset.k=k;im.src=u;bg.style.backgroundImage='url("'+u+'")'}im.hidden=false;bg.style.opacity=1}

/* ---------- 렌더링 ---------- */
const THEME=c=>(S.over==="E6"||S.over==="E1")?"":c<=3?"":c===4?"t2":c===5?"t3":"t4";
function render(){if(!S)return;const R=ROOMS[S.room];sceneImg();
 ["t2","t3","t4"].forEach(t=>document.body.classList.toggle(t,THEME(S.ch)===t));
 $("htitle").textContent="두 번째 봄 — "+S.ch+"장 「"+CHAP[S.ch].name+"」";
 $("hsub").textContent=CHAP[S.ch].day+(S.time?" · "+S.time:"");
 const g=goal();$("hintb").textContent=S.hk===g[0]&&S.hl?"힌트 ("+Math.min(S.hl+1,3)+"/3)":"힌트";
 $("place").textContent=R.name;$("desc").textContent=R.desc;
 const lg=$("log");lg.innerHTML="";S.log.forEach((t,i)=>{const p=document.createElement("p");if(i>=S.from)p.classList.add("new");
  if(t[0]==="§"){p.classList.add("sys");p.textContent="▸ "+t.slice(1)}
  else if(t[0]==="✉"){p.className="msg"+(S.ch>=6?" cold":"");p.textContent=t.slice(1)}
  else if(t[0]==="°"){p.classList.add("faint");p.textContent=t.slice(1)}
  else p.textContent=t;lg.appendChild(p)});lg.scrollTop=lg.scrollHeight;
 const sp=$("spots"),mv=$("moves");sp.innerHTML="";mv.innerHTML="";R.spots.filter(h=>!h.show||h.show()).forEach(h=>{const b=document.createElement("button");b.textContent=h.n;b.onclick=()=>click(h);(h.nav?mv:sp).appendChild(b)});
 $("mw").style.display=mv.children.length?"":"none";$("acts").querySelector(".lbl").style.display=sp.children.length?"":"none";
 const iv=$("inv");iv.innerHTML="";if(!S.inv.length)iv.innerHTML='<span class="mut">비어 있음</span>';S.inv.forEach(id=>{const b=document.createElement("button");b.className="chip"+(S.sel===id?" sel":"");b.textContent=iname(id);b.onclick=()=>pick(id);iv.appendChild(b)});
 const nl=$("notes");nl.innerHTML="";S.notes.forEach(n=>{const li=document.createElement("li"),b=document.createElement("button");b.className=S.sel==="n:"+n.id?"sel":"";b.textContent=n.t;if(n.used){const s=document.createElement("span");s.className="used";s.textContent="회수됨";b.appendChild(s);if(n.then){const t=document.createElement("span");t.className="then";t.textContent="→ "+n.then;b.appendChild(t)}}b.onclick=()=>pickN(n.id);li.appendChild(b);nl.appendChild(li)});$("nc").textContent="("+S.notes.length+")";
 const sb=$("selbar");if(S.sel){const isN=S.sel.startsWith("n:"),nm=isN?"단서: "+S.notes.find(n=>"n:"+n.id===S.sel).t.split(" — ")[0]:iname(S.sel);sb.textContent="선택 중 — "+nm+" · "+(isN?"제시할 인물을 누르세요":"사용할 곳을 누르세요");sb.classList.add("on")}else sb.classList.remove("on");
 const cp=$("codep");cp.classList.toggle("on",!!CODE);
 if(CODE){$("codeh").textContent=CODE.h||"";const bx=$("codebox");if(!$("codein")){bx.innerHTML='<input id="codein" autocomplete="off" inputmode="numeric"><button class="btn" id="codeb">입력</button> <button class="btn" id="codex">닫기</button>';$("codeb").onclick=codeSubmit;$("codein").onkeydown=e=>{if(e.key==="Enter")codeSubmit()};$("codex").onclick=()=>{CODE=null;render()}}$("codein").maxLength=CODE.len}else $("codebox").innerHTML="";
 const op=$("ordp");op.classList.toggle("on",!!PANEL);if(PANEL)PANEL.draw(op);else op.innerHTML="";
 $("acts").style.display=CH?"none":"";const ch=$("chp");ch.innerHTML="";ch.classList.toggle("on",!!CH);if(CH)CH.forEach(o=>{const b=document.createElement("button");b.className="btn";b.textContent=o.t;b.onclick=()=>{S.from=S.log.length;CH=null;o.f()};ch.appendChild(b)});
 $("endv").classList.toggle("on",!!S.over);if(S.over)$("endc").innerHTML=endHTML(S.over);
 save()}
function click(h){S.from=S.log.length;const s=S.sel;S.sel=null;CODE=null;PANEL=null;
 if(s&&!h.nav){if(s.startsWith("n:")){const id=s.slice(2);if(h.pres&&h.pres[id])return h.pres[id]();return say(h.person?"그 이야기를 꺼내 봤지만 별 반응이 없다.":"단서는 사람에게 제시할 수 있다.")}const u=h.use&&h.use[s];if(u)return u();return say("“"+iname(s)+"”은(는) 여기에 쓸 수 없다.")}
 h.look()}
function pick(id){S.from=S.log.length;S.sel=S.sel===id?null:id;if(S.sel)say("“"+iname(id)+"” — "+idesc(id));else render()}
function pickN(id){S.from=S.log.length;S.sel=S.sel==="n:"+id?null:"n:"+id;render()}

/* ---------- 챕터 시작 ---------- */
function showCard(n,after){const c=CHAP[n];$("cardtag").textContent="CHAPTER "+String(n).padStart(2,"0");$("cardname").textContent=c.name;$("cardslp").textContent=c.day;$("card").classList.add("on");$("card").onclick=()=>{$("card").classList.remove("on");after()}}
function startCh(n){const c=CHAP[n];S.ch=n;S.over=0;S.room=c.room;S.f={};S.sel=null;CODE=null;PANEL=null;CH=null;S.log=[];S.from=0;S.time="";S.hk="";S.hl=0;
 render();showCard(n,()=>{say(c.text);const R=ROOMS[c.room];if(R.enter)R.enter()})}

/* ---------- 시작 ---------- */
function begin(s){S=s;CODE=null;PANEL=null;CH=null;$("title").classList.remove("on");if(!S.log.length&&S.ch===1&&!S.f.t1){startCh(1)}else render()}
$("start").onclick=()=>begin(fresh());
$("cont").onclick=()=>{const l=load();if(l)begin(l)};
$("gal").onclick=()=>{$("title").classList.remove("on");$("endv").classList.add("on");$("endc").innerHTML=endHTML("gal")};
$("reset").onclick=()=>{CH=[{t:"처음부터 다시 시작한다",f:()=>begin(fresh())},{t:"취소",f:()=>render()}];render()};
$("hintb").onclick=()=>{if(S)hint()};
$("endc").onclick=e=>{const a=e.target.dataset&&e.target.dataset.act;if(!a)return;
 if(/^c\d$/.test(a)){S.over=0;startCh(+a[1])}
 else if(a==="back"){S.over=0;render()}
 else if(a==="gal"){if(S&&S.over){S.lastOver=S.over;S.over="gal";render()}else $("endc").innerHTML=endHTML("gal")}
 else if(a==="ret"){S.over=S.lastOver;S.lastOver=null;render()}
 else if(a==="close"){$("endv").classList.remove("on");$("title").classList.add("on");showReplyStats()}
 else if(a==="snap"){const sn=G().snap;if(sn){const s=JSON.parse(sn);s.g.snap=sn;begin(s)}}
 else if(a==="again")begin(fresh())};
if(load())$("cont").style.display="";
showReplyStats();

</script></body></html>
